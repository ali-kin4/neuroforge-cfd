[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroforge-cfd"
version = "0.1.0"
description = "Self-correcting, geometry-native AI CFD engine: predict flow fields from geometry + boundary conditions, verify physics residuals, estimate uncertainty, and iteratively self-correct — calling classical CFD only where needed."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Ali Jabbary", email = "st_a.jabbary@urmia.ac.ir" },
  { name = "Kasra Ghanavati", email = "kg1111r@gre.ac.uk" },
]
keywords = ["CFD", "neural-operator", "physics-informed", "machine-learning", "aerodynamics", "scientific-computing", "PDE", "transformer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.0",
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "rich>=13.0",
    "pyyaml>=6.0",
    "threadpoolctl>=3.0",
]

[project.optional-dependencies]
data = ["airfrans>=0.1.1"]
viz = ["pyvista>=0.43"]
app = ["streamlit>=1.30", "plotly>=5.18"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]
all = ["airfrans>=0.1.1", "pyvista>=0.43", "streamlit>=1.30", "plotly>=5.18", "pytest>=7.4", "ruff>=0.4"]

[project.scripts]
neuroforge = "neuroforge.cli:main"

[project.urls]
Homepage = "https://github.com/ali-kin4/neuroforge-cfd"
Repository = "https://github.com/ali-kin4/neuroforge-cfd"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neuroforge = ["py.typed", "assets/*.pt"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# The package __init__ deliberately sets math-library thread caps via env vars
# BEFORE importing numpy/torch-backed submodules, so module-level imports are
# intentionally not at the very top.
"src/neuroforge/__init__.py" = ["E402"]
# Research / reproducibility utilities (not shipped library code). These one-off
# scripts produced the committed paper results; the package (src) and its tests
# are strictly linted, but these are exempted from stylistic and minor rules:
# terse one-line statements (E702), the intentional import-neuroforge-before-numpy
# ordering (E402), zip strict-ness (B905), throwaway loop/temporary vars
# (B007/B023/F841), and printf-style logging (UP031). Correctness rules that catch
# real breakage (F401 unused imports, F811 redefinition, F821 undefined names) stay on.
"scripts/**" = ["E402", "E702", "B905", "B007", "B023", "F841", "UP031", "E741"]
"benchmarks/**" = ["E402", "E702", "B905", "B007", "B023", "F841", "UP031", "E741"]
"examples/**" = ["E402", "E702", "B905", "B007", "B023", "F841", "UP031", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m \"not slow\""
markers = [
    "slow: marks tests as slow (deselected by default; run with -m slow or -m '')",
]
filterwarnings = ["ignore::DeprecationWarning"]

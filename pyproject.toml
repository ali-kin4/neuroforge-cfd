[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroforge-cfd"
version = "0.1.0"
description = "Self-correcting, geometry-native AI CFD engine: predict flow fields from geometry + boundary conditions, verify physics residuals, estimate uncertainty, and iteratively self-correct — calling classical CFD only where needed."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kasra (Ali) Ghanavati" }]
keywords = ["CFD", "neural-operator", "physics-informed", "machine-learning", "aerodynamics", "scientific-computing", "PDE", "transformer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.0",
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "rich>=13.0",
    "pyyaml>=6.0",
    "threadpoolctl>=3.0",
]

[project.optional-dependencies]
data = ["airfrans>=0.1.1"]
viz = ["pyvista>=0.43"]
app = ["streamlit>=1.30", "plotly>=5.18"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]
all = ["airfrans>=0.1.1", "pyvista>=0.43", "streamlit>=1.30", "plotly>=5.18", "pytest>=7.4", "ruff>=0.4"]

[project.scripts]
neuroforge = "neuroforge.cli:main"

[project.urls]
Homepage = "https://github.com/kghanavati/neuroforge-cfd"
Repository = "https://github.com/kghanavati/neuroforge-cfd"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neuroforge = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeuroForge · OpenFOAM</title>
<style>
  :root {
    color-scheme: light;
    --bg:        #f2f1ee;
    --panel:     #fcfcfb;
    --panel-2:   #f6f5f2;
    --line:      #e6e4de;
    --line-2:    #d5d3cb;
    --ink:       #111110;
    --ink-2:     #55544f;
    --ink-3:     #8b8981;
    --s1: #2a78d6;  --s2: #eb6834;  --s3: #1baf7a;  --s4: #eda100;
    --good: #1baf7a; --bad: #d92c2c; --idle: #a5a39a;
    --tint:  color-mix(in srgb, var(--s1) 9%, transparent);
    --shadow-1: 0 1px 2px rgba(20,18,10,.05);
    --shadow-2: 0 1px 2px rgba(20,18,10,.05), 0 12px 28px -12px rgba(20,18,10,.16);
    --r: 12px;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#0e0e0d; --panel:#171716; --panel-2:#1f1f1e;
      --line:#292928; --line-2:#3a3a37; --ink:#f7f7f5; --ink-2:#b9b8ae; --ink-3:#7e7d76;
      --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
      --good:#199e70; --bad:#e0504f; --idle:#5f5e58;
      --shadow-1: 0 1px 2px rgba(0,0,0,.5);
      --shadow-2: 0 1px 2px rgba(0,0,0,.5), 0 14px 34px -14px rgba(0,0,0,.7); }
  }
  :root[data-theme="dark"] { --bg:#0e0e0d; --panel:#171716; --panel-2:#1f1f1e;
    --line:#292928; --line-2:#3a3a37; --ink:#f7f7f5; --ink-2:#b9b8ae; --ink-3:#7e7d76;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --good:#199e70; --bad:#e0504f; --idle:#5f5e58;
    --shadow-1: 0 1px 2px rgba(0,0,0,.5);
    --shadow-2: 0 1px 2px rgba(0,0,0,.5), 0 14px 34px -14px rgba(0,0,0,.7); }

  * { box-sizing: border-box; min-width: 0; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 13.5px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; letter-spacing: -.005em;
  }
  .num { font-variant-numeric: tabular-nums; }

  /* ── shell ───────────────────────────────────────────────────────────── */
  .app { display: grid; grid-template-columns: 296px minmax(0,1fr); height: 100vh; }
  @media (max-width: 1080px) { .app { grid-template-columns: 1fr; height: auto; } }

  aside { background: var(--panel); border-right: 1px solid var(--line);
          display: flex; flex-direction: column; min-height: 0; }
  .brand { padding: 16px 18px 13px; border-bottom: 1px solid var(--line); }
  .brand h1 { margin: 0; font-size: 14px; font-weight: 660; letter-spacing: -.015em; }
  .brand p { margin: 2px 0 0; font-size: 11.5px; color: var(--ink-3); }
  .search { padding: 11px 14px; border-bottom: 1px solid var(--line); }
  .search input {
    width: 100%; font: inherit; font-size: 12.5px; color: var(--ink);
    background: var(--panel-2); border: 1px solid var(--line-2);
    border-radius: 9px; padding: 7px 10px;
  }
  .search input:focus { outline: 2px solid color-mix(in srgb, var(--s1) 45%, transparent);
                        outline-offset: -1px; border-color: transparent; }
  .runs { overflow-y: auto; flex: 1; padding-bottom: 12px; }
  .grp { padding: 14px 16px 5px; font-size: 10.5px; font-weight: 700; letter-spacing: .07em;
         text-transform: uppercase; color: var(--ink-3); display: flex; gap: 8px; align-items: baseline; }
  .grp b { color: var(--ink-2); font-weight: 700; }
  .grp i { font-style: normal; margin-left: auto; color: var(--ink-3); font-weight: 600; letter-spacing: 0; }

  .run { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; width: 100%;
         text-align: left; background: none; border: 0; cursor: pointer;
         padding: 7px 16px; border-left: 2px solid transparent; font: inherit; color: inherit; }
  .run:hover { background: var(--panel-2); }
  .run[aria-selected="true"] { background: var(--tint); border-left-color: var(--s1); }
  .run .nm { font-size: 12px; font-weight: 570; overflow: hidden;
             text-overflow: ellipsis; white-space: nowrap; }
  .run .sub { grid-column: 1; font-size: 10.5px; color: var(--ink-3); }
  .run .spark { grid-column: 2; grid-row: 1 / span 2; width: 54px; height: 22px; align-self: center; }
  .st { width: 7px; height: 7px; border-radius: 50%; display: inline-block;
        margin-right: 6px; vertical-align: 1px; background: var(--idle); }
  .st.solving { background: var(--s1); animation: pulse 1.5s ease-in-out infinite; }
  .st.converged { background: var(--good); }
  .st.failed { background: var(--bad); }
  .st.done { background: var(--line-2); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  @media (prefers-reduced-motion: reduce) { .st.solving { animation: none; } }

  /* ── main ────────────────────────────────────────────────────────────── */
  main { overflow-y: auto; overflow-x: hidden; padding: 0 0 34px; }
  .bar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px;
         padding: 13px 26px; background: color-mix(in srgb, var(--bg) 82%, transparent);
         backdrop-filter: saturate(1.6) blur(14px); border-bottom: 1px solid var(--line); }
  .tag { display: inline-flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 600;
         color: var(--ink-2); background: var(--panel); border: 1px solid var(--line-2);
         padding: 4px 10px; border-radius: 999px; }
  .tag.live { color: var(--s1); border-color: color-mix(in srgb, var(--s1) 42%, var(--line-2)); }
  .grow { flex: 1; }
  button { font: inherit; font-size: 11.5px; font-weight: 600; color: var(--ink-2);
           background: var(--panel); border: 1px solid var(--line-2);
           border-radius: 8px; padding: 5px 11px; cursor: pointer; }
  button:hover { color: var(--ink); border-color: var(--ink-3); }

  .wrap { padding: 20px 26px 0; display: grid; gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line);
          border-radius: var(--r); box-shadow: var(--shadow-1); overflow: hidden; }
  .card.lift { box-shadow: var(--shadow-2); }
  .hd { display: flex; align-items: baseline; gap: 10px; padding: 14px 18px 0; }
  .hd h2 { margin: 0; font-size: 13px; font-weight: 640; letter-spacing: -.01em; }
  .hd p { margin: 0; font-size: 11.5px; color: var(--ink-3); }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px,1fr)); gap: 1px;
           background: var(--line); border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); }
  .stat { background: var(--panel); padding: 13px 16px; }
  .stat .k { font-size: 10.5px; font-weight: 660; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
  .stat .v { font-size: 23px; font-weight: 660; letter-spacing: -.03em; margin-top: 3px; }
  .stat .v small { font-size: 12px; color: var(--ink-3); font-weight: 550; letter-spacing: 0; }

  .split { display: grid; grid-template-columns: minmax(0,1fr) 300px; gap: 16px; }
  /* The sidebar takes 296px, so the two-column split only fits comfortably
     past ~1500px; below that the case panel stacks under the chart. */
  @media (max-width: 1500px) { .split { grid-template-columns: 1fr; } }

  .chartwrap { position: relative; padding: 4px 14px 12px; }
  svg { display: block; width: 100%; height: auto; }
  .keys { display: flex; gap: 15px; padding: 9px 18px 0; flex-wrap: wrap; }
  .keys span { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px;
               font-weight: 600; color: var(--ink-2); }
  .sw { width: 9px; height: 9px; border-radius: 2.5px; }

  #tip { position: absolute; pointer-events: none; opacity: 0; transition: opacity .1s;
         background: var(--panel); border: 1px solid var(--line-2); border-radius: 10px;
         box-shadow: var(--shadow-2); padding: 9px 11px; font-size: 11.5px; min-width: 138px; z-index: 6; }
  #tip b { display: block; font-size: 10.5px; color: var(--ink-3); margin-bottom: 6px;
           text-transform: uppercase; letter-spacing: .05em; }
  #tip div { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
  #tip em { font-style: normal; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
  #tip code { font-family: var(--mono); font-size: 11px; color: var(--ink); }

  .facts { padding: 12px 18px 16px; display: grid; gap: 0; }
  .fact { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0;
          font-size: 12px; border-bottom: 1px dashed var(--line); }
  .fact:last-child { border-bottom: 0; }
  .fact span:first-child { color: var(--ink-3); }
  .fact span:last-child { font-weight: 620; font-family: var(--mono); font-size: 11.5px; }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: right; font-size: 10.5px; text-transform: uppercase; letter-spacing: .055em;
       color: var(--ink-3); font-weight: 660; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  td { padding: 9px 14px; border-bottom: 1px solid var(--line); text-align: right; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: var(--panel-2); }
  td.pos { color: var(--good); font-weight: 660; }
  td.neg { color: var(--bad); font-weight: 660; }
  .exp + .exp { border-top: 1px solid var(--line); }
  .exp h3 { margin: 0; padding: 13px 14px 4px; font-size: 12px; font-weight: 640; }
  .exp h3 span { color: var(--ink-3); font-weight: 500; }
  .empty { padding: 34px; text-align: center; color: var(--ink-3); font-size: 12.5px; }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <h1>NeuroForge</h1>
      <p>OpenFOAM run monitor</p>
    </div>
    <div class="search"><input id="q" type="search" placeholder="Filter runs…" autocomplete="off"></div>
    <div class="runs" id="runs"></div>
  </aside>

  <main>
    <div class="bar">
      <span class="tag" id="live"><i class="st"></i><span id="liveText">connecting…</span></span>
      <span class="tag num" id="clock">—</span>
      <span class="grow"></span>
      <button id="theme">Theme</button>
    </div>

    <div class="wrap">
      <section class="stats" id="stats"></section>

      <section class="split">
        <div class="card lift">
          <div class="hd"><h2 id="chartTitle">Residuals</h2><p id="chartSub">—</p></div>
          <div class="keys" id="keys"></div>
          <div class="chartwrap">
            <svg id="chart" viewBox="0 0 860 360" role="img" aria-label="Residual history"></svg>
            <div id="tip"></div>
          </div>
        </div>

        <div class="card">
          <div class="hd"><h2>Case</h2></div>
          <div class="chartwrap" style="padding-bottom:2px">
            <svg id="geom" viewBox="0 0 300 150" role="img" aria-label="Section and mesh"></svg>
          </div>
          <div class="facts" id="facts"></div>
        </div>
      </section>

      <section class="card">
        <div class="hd"><h2>Experiments</h2><p>iteration saving vs a cold start</p></div>
        <div id="exps"></div>
      </section>
    </div>
  </main>
</div>

<script>
const SERIES = [["Ux","var(--s1)"],["Uy","var(--s2)"],["p","var(--s3)"],["nuTilda","var(--s4)"]];
const NS = "http://www.w3.org/2000/svg";
let DATA = null, sel = null, hx = null, filter = "";

const $ = (id) => document.getElementById(id);
const sci = (v) => (v == null || Number.isNaN(v)) ? "—" : Number(v).toExponential(1);
const num = (v) => v == null ? "—" : Number(v).toLocaleString();
const dur = (s) => s == null ? "—"
  : s >= 3600 ? `${(s / 3600).toFixed(1)} h`
  : s > 90 ? `${Math.round(s / 60)} min` : `${Math.round(s)} s`;
const hrs = (s) => !s ? "0" : s >= 3600 ? `${(s / 3600).toFixed(1)}h` : `${Math.round(s / 60)}m`;
const mk = (t, a) => { const n = document.createElementNS(NS, t); for (const k in a) n.setAttribute(k, a[k]); return n; };

$("theme").onclick = () => {
  const r = document.documentElement, c = r.getAttribute("data-theme");
  if (c === "dark") r.setAttribute("data-theme", "light");
  else if (c === "light") r.removeAttribute("data-theme");
  else r.setAttribute("data-theme", "dark");
  paint();
};
$("q").oninput = (e) => { filter = e.target.value.toLowerCase(); paint(); };

/* ── sparkline ─────────────────────────────────────────────────────────── */
function spark(vals, status) {
  if (!vals || vals.length < 3) return "";
  const lo = Math.log10(Math.max(Math.min(...vals.filter(v => v > 0)), 1e-12));
  const hi = Math.log10(Math.max(...vals, 1e-11));
  const rng = Math.max(hi - lo, .5);
  const pts = vals.map((v, i) => {
    const x = (i / (vals.length - 1)) * 52 + 1;
    const y = 20 - ((Math.log10(Math.max(v, 1e-12)) - lo) / rng) * 18;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  const c = status === "solving" ? "var(--s1)" : status === "failed" ? "var(--bad)" : "var(--line-2)";
  return `<svg class="spark" viewBox="0 0 54 22" aria-hidden="true">
    <polyline points="${pts}" fill="none" stroke="${c}" stroke-width="1.5"
      stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

/* ── residual chart ────────────────────────────────────────────────────── */
function chart(run) {
  const svg = $("chart"); svg.textContent = "";
  const W = 860, H = 360, L = 58, R = 84, T = 12, B = 30;
  const ss = run ? SERIES.filter(([k]) => (run.residuals[k] || []).length > 1) : [];
  if (!ss.length) {
    $("keys").textContent = "";
    $("chartSub").textContent = run
      ? (run.status === "solving" ? "waiting for the first step…" : "no residual history")
      : "select a run";
    return;
  }
  const n = Math.max(...ss.map(([k]) => run.residuals[k].length));
  const its = run.iterations || n;
  let lo = Infinity, hi = -Infinity;
  for (const [k] of ss) for (const v of run.residuals[k]) if (v > 0) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
  const e0 = Math.floor(Math.log10(Math.max(lo, 1e-12))), e1 = Math.ceil(Math.log10(hi));
  const X = i => L + (i / Math.max(n - 1, 1)) * (W - L - R);
  const Y = v => H - B - ((Math.log10(Math.max(v, 1e-12)) - e0) / Math.max(e1 - e0, 1)) * (H - T - B);

  for (let e = e0; e <= e1; e++) {
    const y = Y(10 ** e);
    svg.appendChild(mk("line", { x1: L, x2: W - R, y1: y, y2: y, stroke: "var(--line)", "stroke-width": 1 }));
    const t = mk("text", { x: L - 10, y: y + 3.5, "text-anchor": "end", fill: "var(--ink-3)", "font-size": 10 });
    t.textContent = `1e${e}`; svg.appendChild(t);
  }
  for (let k = 0; k <= 4; k++) {
    const i = Math.round((n - 1) * k / 4);
    const t = mk("text", { x: X(i), y: H - B + 17, "text-anchor": "middle", fill: "var(--ink-3)", "font-size": 10 });
    t.textContent = Math.round(its * k / 4); svg.appendChild(t);
  }
  const ends = [];
  for (const [k, c] of ss) {
    const v = run.residuals[k];
    let d = ""; v.forEach((y, i) => d += (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(y).toFixed(1));
    svg.appendChild(mk("path", { d, fill: "none", stroke: c, "stroke-width": 1.9,
      "stroke-linejoin": "round", "stroke-linecap": "round", opacity: .95 }));
    ends.push({ k, c, y: Y(v[v.length - 1]) });
  }
  // Series that finish at similar residuals would print their labels on top of
  // each other; nudge them apart, keeping the order, and elbow a leader line
  // back to the true end point so the label still reads as belonging to it.
  ends.sort((a, b) => a.y - b.y);
  const GAP = 13;
  for (let i = 1; i < ends.length; i++)
    if (ends[i].y - ends[i - 1].y < GAP) ends[i].y = ends[i - 1].y + GAP;
  const over = ends.length && ends[ends.length - 1].y - (H - B);
  if (over > 0) for (const e of ends) e.y -= over;
  for (const e of ends) {
    const trueY = Y(run.residuals[e.k][run.residuals[e.k].length - 1]);
    if (Math.abs(trueY - e.y) > 1.5) {
      svg.appendChild(mk("path", {
        d: `M${W - R} ${trueY.toFixed(1)}L${W - R + 5} ${trueY.toFixed(1)}` +
           `L${W - R + 7} ${e.y.toFixed(1)}`,
        fill: "none", stroke: e.c, "stroke-width": 1, opacity: .55 }));
    }
    const lab = mk("text", { x: W - R + 10, y: e.y + 3.5, fill: e.c,
      "font-size": 10.5, "font-weight": 700 });
    lab.textContent = e.k; svg.appendChild(lab);
  }
  if (hx != null) {
    const i = Math.max(0, Math.min(n - 1, Math.round(hx * (n - 1))));
    svg.appendChild(mk("line", { x1: X(i), x2: X(i), y1: T, y2: H - B, stroke: "var(--ink-3)",
      "stroke-width": 1, "stroke-dasharray": "3 4" }));
    let rows = "";
    for (const [k, c] of ss) {
      const v = run.residuals[k][Math.min(i, run.residuals[k].length - 1)];
      svg.appendChild(mk("circle", { cx: X(i), cy: Y(v), r: 3.6, fill: c,
        stroke: "var(--panel)", "stroke-width": 2 }));
      rows += `<div><em><i class="sw" style="background:${c}"></i>${k}</em><code>${sci(v)}</code></div>`;
    }
    const tip = $("tip");
    tip.innerHTML = `<b>iteration ${Math.round(its * i / Math.max(n - 1, 1))}</b>${rows}`;
    tip.style.opacity = 1;
    tip.style.left = `calc(${(X(i) / W * 100).toFixed(1)}% - 70px)`;
    tip.style.top = "10px";
  } else $("tip").style.opacity = 0;

  $("keys").innerHTML = ss.map(([k, c]) => `<span><i class="sw" style="background:${c}"></i>${k}</span>`).join("");
  const bits = [`${num(run.iterations)} / ${num(run.n_iter)} iterations`, `floor ${sci(run.floor)}`];
  if (run.to_1e3) bits.push(`1e-3 at ${run.to_1e3}`);
  if (run.eta) bits.push(`~${dur(run.eta)} left`);
  $("chartSub").textContent = bits.join("  ·  ");
}
$("chart").addEventListener("pointermove", e => {
  const r = e.currentTarget.getBoundingClientRect(), L = 58 / 860, R = 84 / 860;
  hx = Math.max(0, Math.min(1, ((e.clientX - r.left) / r.width - L) / (1 - L - R)));
  if (sel) chart(sel);
});
$("chart").addEventListener("pointerleave", () => { hx = null; if (sel) chart(sel); });

/* ── geometry ──────────────────────────────────────────────────────────── */
function geom(g) {
  const svg = $("geom"); svg.textContent = "";
  if (!g || !g.section) return;
  const W = 300, H = 150, x0 = -0.45, x1 = 1.95, pad = 10;
  const s = (W - 2 * pad) / (x1 - x0), P = ([x, y]) => [pad + (x - x0) * s, H / 2 - y * s];
  const path = (pts) => pts.map((p, i) => { const q = P(p); return (i ? "L" : "M") + q[0].toFixed(1) + " " + q[1].toFixed(1); }).join("");
  for (const ln of (g.wire || []))
    svg.appendChild(mk("path", { d: path(ln), fill: "none", stroke: "var(--line-2)", "stroke-width": .5, opacity: .85 }));
  if (g.cut) svg.appendChild(mk("path", { d: path(g.cut), fill: "none", stroke: "var(--s2)", "stroke-width": 1.4 }));
  svg.appendChild(mk("path", { d: path(g.section) + "Z", fill: "var(--ink)" }));
}

/* ── paint ─────────────────────────────────────────────────────────────── */
function paint() {
  if (!DATA) return;
  const t = DATA.totals;
  const pct = t.planned ? Math.round(100 * t.iterations / t.planned) : 0;
  $("stats").innerHTML = [
    ["Solving now", num(t.solving), t.eta ? "· " + dur(t.eta) + " left" : ""],
    ["Runs", num(t.runs), `· ${t.converged} converged`],
    ["Iterations", (t.iterations / 1000).toFixed(1) + "k", `· of ${(t.planned / 1000).toFixed(0)}k · ${pct}%`],
    ["Solver runtime", hrs(t.solver_seconds), ""],
    ["Cells meshed", (t.cells / 1000).toFixed(0) + "k", ""],
    ["Failed", num(t.failed), ""],
  ].map(([k, v, s]) => `<div class="stat"><div class="k">${k}</div>
      <div class="v num">${v}${s ? ` <small>${s}</small>` : ""}</div></div>`).join("");

  $("live").className = "tag" + (t.solving ? " live" : "");
  $("live").querySelector(".st").className = "st" + (t.solving ? " solving" : "");
  $("liveText").textContent = t.solving
    ? `${t.solving} solving` + (t.eta ? ` · ${dur(t.eta)} left` : "")
    : "idle";
  $("clock").textContent = new Date(DATA.generated * 1000).toLocaleTimeString();

  const shown = DATA.runs.filter(r => !filter || r.name.toLowerCase().includes(filter)
    || (r.group || "").toLowerCase().includes(filter));
  const groups = new Map();
  for (const r of shown) (groups.get(r.group) || groups.set(r.group, []).get(r.group)).push(r);

  let html = "";
  for (const [g, rs] of groups) {
    const act = rs.filter(r => r.status === "solving").length;
    html += `<div class="grp"><b>${g}</b><i>${act ? act + " live" : rs.length}</i></div>`;
    html += rs.map(r => `<button class="run" data-n="${r.name}"
        aria-selected="${sel && sel.name === r.name}">
        <span class="nm"><i class="st ${r.status}"></i>${r.name}</span>
        <span class="sub num">${r.start} · ${num(r.iterations)}/${num(r.n_iter)} · ${
          dur(r.elapsed)}${r.eta ? " · " + dur(r.eta) + " left" : ""}</span>
        ${spark(r.spark, r.status)}</button>`).join("");
  }
  $("runs").innerHTML = html || '<div class="empty">nothing matches</div>';
  for (const b of $("runs").querySelectorAll(".run"))
    b.onclick = () => { sel = DATA.runs.find(r => r.name === b.dataset.n); paint(); };

  if (sel) { const f = DATA.runs.find(r => r.name === sel.name); if (f) sel = f; }
  if (!sel && DATA.runs.length) {
    const has = r => Object.values(r.residuals || {}).some(v => v.length > 1);
    sel = DATA.runs.find(r => r.status === "solving" && has(r)) || DATA.runs.find(has) || DATA.runs[0];
  }
  if (sel) {
    $("chartTitle").textContent = sel.name;
    chart(sel);
    $("facts").innerHTML = [
      ["status", sel.status],
      ["iterations", `${num(sel.iterations)} / ${num(sel.n_iter)}`],
      ["runtime", dur(sel.elapsed)],
      ["eta", sel.eta ? dur(sel.eta) : (sel.status === "solving" ? "…" : "—")],
      ["solver clock", sel.exec_time != null ? dur(sel.exec_time) : "—"],
      ["mesh", `${sel.mesh} · ${num(sel.n_cells)} cells`],
      ["start", sel.start],
      ["ν", sel.nu != null ? Number(sel.nu).toExponential(2) : "—"],
      ["floor", sci(sel.floor)],
      ["→ 1e-3", sel.to_1e3 ?? "—"], ["→ 1e-4", sel.to_1e4 ?? "—"],
    ].map(([k, v]) => `<div class="fact"><span>${k}</span><span>${v}</span></div>`).join("");
  }
  geom(DATA.geometry);

  $("exps").innerHTML = (DATA.experiments || []).map(e => {
    const s = e.summary || {};
    const th = s.per_threshold;
    if (th) {
      const arms = [...new Set(Object.values(th).flatMap(v =>
        Object.keys(v).filter(k => k.endsWith("_saving")).map(k => k.slice(0, -7))))];
      return `<div class="exp"><h3>${e.name}</h3><table><thead><tr><th>threshold</th>` +
        arms.map(a => `<th>${a.replace(/_/g, " ")}</th>`).join("") + `</tr></thead><tbody>` +
        Object.entries(th).map(([k, v]) => `<tr><td class="num">${k}</td>` + arms.map(a => {
          const x = v[a + "_saving"];
          return (x == null || Number.isNaN(x)) ? "<td>—</td>"
            : `<td class="num ${x > .02 ? "pos" : x < -.02 ? "neg" : ""}">${(x * 100).toFixed(1)}%</td>`;
        }).join("") + "</tr>").join("") + "</tbody></table></div>";
    }
    const byRe = s.by_reynolds;
    if (byRe) {
      const arms = [...new Set(Object.values(byRe).flatMap(v =>
        Object.keys(v).filter(k => k.endsWith("@1e-03")).map(k => k.slice(0, -6))))];
      return `<div class="exp"><h3>${e.name} <span>· saving at residual 1e-3</span></h3>
        <table><thead><tr><th>Re</th><th>δ / h</th>` +
        arms.map(a => `<th>${a.replace(/_/g, " ")}</th>`).join("") + `</tr></thead><tbody>` +
        Object.entries(byRe).map(([re, v]) => `<tr><td class="num">${re}</td>
          <td class="num">${v.delta_over_h.toFixed(2)}</td>` + arms.map(a => {
            const x = v[a + "@1e-03"];
            return (x == null) ? "<td>—</td>"
              : `<td class="num ${x > .02 ? "pos" : x < -.02 ? "neg" : ""}">${(x * 100).toFixed(1)}%</td>`;
          }).join("") + "</tr>").join("") + "</tbody></table></div>";
    }
    return "";
  }).join("") || '<div class="empty">no finished experiments yet</div>';
}

async function poll() {
  try { DATA = await (await fetch("/data.json", { cache: "no-store" })).json(); paint(); }
  catch { $("liveText").textContent = "server offline"; $("live").className = "tag"; }
}
poll(); setInterval(poll, 2000);
</script>
</body>
</html>
